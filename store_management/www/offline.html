<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#146c43">
  <title>Offline · My Sales</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:1.5rem;background:#f4f8f5;color:#17221d;font-family:system-ui,sans-serif}.card{width:min(100%,28rem);padding:2rem;border:1px solid #dfe7e2;border-radius:1.5rem;background:#fff;box-shadow:0 18px 50px rgba(25,49,37,.1);text-align:center}.mark{display:grid;place-items:center;width:4rem;height:4rem;margin:0 auto 1.25rem;border-radius:1.2rem;background:#146c43;color:#fff;font-size:1.8rem;font-weight:800}h1{margin:0;font-size:1.7rem}p{margin:1rem 0 1.5rem;color:#69756f;line-height:1.55}button{min-height:48px;width:100%;border:0;border-radius:.9rem;background:#146c43;color:#fff;font-size:1rem;font-weight:750;cursor:pointer}
  </style>
</head>
<body>
  <main class="card"><div class="mark">M</div><h1>You’re offline</h1><p>My Sales needs a connection to securely load store data and create bills. Reconnect, then try again.</p><button type="button" onclick="location.reload()">Try again</button></main>
</body>
</html>
